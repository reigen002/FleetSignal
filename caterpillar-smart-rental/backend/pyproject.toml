[project]
name = "srts-backend"
version = "1.0.0"
description = "Smart Rental Tracking System — FastAPI backend for Caterpillar dealers"
requires-python = ">=3.11"

dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    "sqlalchemy==2.0.30",
    "alembic==1.13.2",
    "pydantic==2.7.1",
    "pydantic-settings==2.3.0",
    "python-multipart==0.0.9",
    "httpx==0.27.0",
    "numpy==1.26.4",
    "python-dateutil==2.9.0",
]

[project.optional-dependencies]
dev = [
    "faker==25.2.0",
    "pytest==8.2.0",
    "pytest-anyio==0.0.0",
    "httpx==0.27.0",
    "anyio==4.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
# uv venv is stored in .venv by default; nothing extra needed.
