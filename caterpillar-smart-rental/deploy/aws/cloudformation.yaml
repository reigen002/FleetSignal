AWSTemplateFormatVersion: '2010-09-09'
Description: FleetSignal single-instance demo; no public web ingress; retained SQLite EBS volume.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Existing subnet in AvailabilityZone, with an internet gateway route for outbound HTTPS.
  AvailabilityZone:
    Type: AWS::EC2::AvailabilityZone::Name
    Description: Must match SubnetId; keep unchanged to preserve the data volume.
  ImageId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  InstanceType:
    Type: String
    Default: t3.small
    AllowedValues: [t3.small, t3.medium]
  PrivateWebClientCidr:
    Type: String
    Default: ''
    Description: Optional isolated trusted RFC1918 client /32. Keep empty for SSM forwarding; do not use shared VPN egress.
    AllowedPattern: '^$|^(?:10(?:\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){3}|172\.(?:1[6-9]|2[0-9]|3[01])(?:\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){2}|192\.168(?:\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){2})/32$'
    ConstraintDescription: Leave empty, or supply an RFC1918 IPv4 /32 with octets from 0 to 255 and no leading zeros.

Conditions:
  AllowPrivateWeb: !Not [!Equals [!Ref PrivateWebClientCidr, '']]

Resources:
  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: FleetSignal demo; SSM administration; optional private HTTP client only
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS package/image downloads and SSM agent connections
  PrivateWebIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: AllowPrivateWeb
    Properties:
      GroupId: !GetAtt WebSecurityGroup.GroupId
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
      CidrIp: !Ref PrivateWebClientCidr
      Description: One trusted private client; application has no authentication

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SessionManagerOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssm:UpdateInstanceInformation
                  - ssmmessages:CreateControlChannel
                  - ssmmessages:CreateDataChannel
                  - ssmmessages:OpenControlChannel
                  - ssmmessages:OpenDataChannel
                # These agent channel operations do not support resource-level scoping.
                Resource: '*'
  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  DataVolume:
    Type: AWS::EC2::Volume
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AvailabilityZone: !Ref AvailabilityZone
      Encrypted: true
      VolumeType: gp3
      Size: 8
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-sqlite-retained'

  DemoInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      AvailabilityZone: !Ref AvailabilityZone
      IamInstanceProfile: !Ref InstanceProfile
      MetadataOptions:
        HttpTokens: required
        HttpPutResponseHopLimit: 1
      NetworkInterfaces:
        - DeviceIndex: '0'
          AssociatePublicIpAddress: true
          SubnetId: !Ref SubnetId
          GroupSet: [!GetAtt WebSecurityGroup.GroupId]
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            Encrypted: true
            VolumeType: gp3
            VolumeSize: 16
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-demo'
      # Install tools only. App checkout and volume initialization are explicit SSM steps.
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -euo pipefail
          dnf install -y docker git e2fsprogs util-linux
          mkdir -p /usr/local/lib/docker/cli-plugins
          cd /usr/local/lib/docker/cli-plugins
          curl --fail --location --retry 3 -o docker-compose https://github.com/docker/compose/releases/download/v5.0.2/docker-compose-linux-x86_64
          curl --fail --location --retry 3 -o compose.sha256 https://github.com/docker/compose/releases/download/v5.0.2/docker-compose-linux-x86_64.sha256
          sha256sum --check <(sed 's/docker-compose-linux-x86_64/docker-compose/' compose.sha256)
          curl --fail --location --retry 3 -o docker-buildx https://github.com/docker/buildx/releases/download/v0.28.0/buildx-v0.28.0.linux-amd64
          curl --fail --location --retry 3 -o buildx.checksums https://github.com/docker/buildx/releases/download/v0.28.0/checksums.txt
          grep ' buildx-v0.28.0.linux-amd64$' buildx.checksums | sed 's/buildx-v0.28.0.linux-amd64/docker-buildx/' | sha256sum --check --strict
          chmod 0755 docker-compose docker-buildx
          systemctl enable --now docker amazon-ssm-agent

  DataAttachment:
    Type: AWS::EC2::VolumeAttachment
    Properties:
      InstanceId: !Ref DemoInstance
      VolumeId: !Ref DataVolume
      Device: /dev/sdf

Outputs:
  InstanceId:
    Value: !Ref DemoInstance
  DataVolumeId:
    Description: Retained on stack deletion/replacement; record this ID before teardown.
    Value: !Ref DataVolume
  PrivateWebUrl:
    Description: Reachable only with private routing and the optional ingress rule; otherwise use SSM.
    Value: !Sub 'http://${DemoInstance.PrivateIp}:8080'
