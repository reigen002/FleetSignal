name: FleetSignal

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: caterpillar-smart-rental/backend
    env:
      FLEETSIGNAL_DATABASE_URL: sqlite:////tmp/fleetsignal-ci.db
      FLEETSIGNAL_DEMO_MODE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.0'
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen python -m app.migrations
      - run: uv run --frozen pytest -q -p no:cacheprovider

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: caterpillar-smart-rental/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: caterpillar-smart-rental/frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  deployment:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: caterpillar-smart-rental
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.0'
      - name: Validate deployment Compose
        run: docker compose -f deploy/aws/compose.yaml config --quiet
      - name: Lint CloudFormation locally
        run: uvx --from cfn-lint==1.57.2 cfn-lint deploy/aws/cloudformation.yaml
      - name: Check setup and user-data shell syntax
        run: |
          bash -n deploy/aws/setup.sh
          python - <<'PY' | bash -n
          from pathlib import Path
          import textwrap
          template = Path('deploy/aws/cloudformation.yaml').read_text(encoding='utf-8')
          user_data = template.split('        Fn::Base64: |\n', 1)[1].split('\n  DataAttachment:', 1)[0]
          print(textwrap.dedent(user_data))
          PY
      - name: Check CIDR and mocked storage safety
        run: python deploy/aws/test_deployment.py
